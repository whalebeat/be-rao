{% extends "admin/base.html" %}
{% block title %}Thương hiệu{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Thương hiệu</h1>
<form method="post" class="adm-card p-3 mb-3 d-flex gap-2" style="max-width:520px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="visually-hidden" for="bname">Tên thương hiệu</label>
  <input id="bname" name="name" class="form-control" placeholder="Tên thương hiệu mới" required maxlength="200">
  <button type="submit" class="btn btn-primary text-nowrap">Thêm</button>
</form>
<div class="adm-card table-responsive" style="max-width:820px">
  <table class="table align-middle mb-0">
    <thead><tr><th>Tên</th><th class="text-end">Sản phẩm</th><th></th></tr></thead>
    <tbody>
      {% for b in brands %}
      <tr>
        <td>
          <form method="post" action="{{ url_for('admin.brand_edit', brand_id=b.id) }}" class="d-flex gap-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input name="name" value="{{ b.name }}" class="form-control form-control-sm" maxlength="200" aria-label="Tên thương hiệu">
            <button class="btn btn-sm btn-outline-secondary">Lưu</button>
          </form>
        </td>
        <td class="text-end">{{ counts.get(b.id, 0) }}</td>
        <td class="text-end">
          <form method="post" action="{{ url_for('admin.brand_delete', brand_id=b.id) }}" class="d-inline" data-confirm="Xóa thương hiệu này? Sản phẩm vẫn được giữ.">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Xóa</button>
          </form>
        </td>
      </tr>
      {% else %}<tr><td colspan="3" class="text-muted p-3">Chưa có thương hiệu.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
