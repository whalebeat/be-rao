{% extends "admin/base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="adm-card p-4" style="max-width:460px">
  <h1 class="h4 mb-3">Đổi mật khẩu</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="cp">Mật khẩu hiện tại</label><input id="cp" name="current_password" type="password" class="form-control" required autocomplete="current-password"></div>
    <div class="mb-3"><label class="form-label" for="np">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="np" name="new_password" type="password" class="form-control" required minlength="8" autocomplete="new-password"></div>
    <div class="mb-3"><label class="form-label" for="cf">Nhập lại mật khẩu mới</label><input id="cf" name="confirm_password" type="password" class="form-control" required minlength="8" autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary">Lưu mật khẩu</button>
  </form>
</div>
{% endblock %}
